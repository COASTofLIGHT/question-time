<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opinions, Likes &amp; Dislikes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
  :root {
    --mist: #EDF3F2;
    --ink: #10303A;
    --ink-soft: #456670;
    --line: #5F808A;
    --focus: #0B62A4;
    --font: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
    --opinion-c: #F4B5A0;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
  }

  body {
    background: var(--mist);
    color: var(--ink);
    font-family: var(--font);
    -webkit-text-size-adjust: 100%;
  }

  .page {
    max-width: 1100px;
    height: 100vh;
    height: 100dvh;
    margin: 0 auto;
    padding: clamp(0.75rem, 2.2vw, 1.5rem);
    display: flex;
    flex-direction: column;
  }

  .back {
    display: inline-block;
    flex: 0 0 auto;
    align-self: flex-start;
    margin-bottom: 0.5rem;
    color: var(--ink-soft);
    font-size: 0.9rem;
    text-decoration: none;
  }
  .back:hover { text-decoration: underline; }
  .back:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  header { flex: 0 0 auto; }

  header h1 {
    margin: 0;
    font-size: clamp(1.3rem, 2.6vw, 1.9rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.05;
  }

  header p {
    margin: 0.25rem 0 0;
    color: var(--ink-soft);
    font-size: 0.9rem;
  }

  /* Opinion tile */
  .opinion-tile {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
    width: 100%;
    min-height: clamp(4.5rem, 10vh, 6.5rem);
    margin: 0.65rem 0 0;
    padding: clamp(0.75rem, 2vw, 1.2rem) clamp(1rem, 2.6vw, 1.6rem);
    border: 0;
    border-radius: 0.9rem;
    background: var(--opinion-c);
    color: var(--ink);
    font: inherit;
    cursor: pointer;
    text-align: center;
  }
  .opinion-tile:hover { filter: brightness(0.97); }
  .opinion-tile:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }

  .tag {
    position: absolute;
    top: 0.8rem;
    left: 1rem;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    opacity: 0.5;
  }

  .opinion {
    font-size: clamp(1.05rem, 2.4vw, 1.5rem);
    font-weight: 700;
    line-height: 1.25;
    letter-spacing: -0.01em;
    max-width: 100%;
    text-wrap: balance;
  }

  @keyframes settle {
    from { opacity: 0; transform: translateY(0.4rem); }
    to   { opacity: 1; transform: none; }
  }
  .opinion.fresh { animation: settle 0.22s ease-out; }

  /* Language reference */
  .lang-scroll {
    flex: 1 1 auto;
    min-height: 0;
    margin-top: 0.75rem;
    overflow-y: auto;
  }

  /* Cards share the space evenly, but never shrink smaller than their text;
     on small screens the area scrolls instead of squashing the cards. */
  .lang-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-auto-rows: minmax(max-content, 1fr);
    gap: clamp(0.45rem, 1.2vw, 0.75rem);
    margin: 0;
    padding: 0 0.1rem 0.1rem;
    list-style: none;
    min-height: 100%;
  }

  .lang-grid li:nth-child(6n+1) { --c: #A8D5CB; }
  .lang-grid li:nth-child(6n+2) { --c: #F2D9A6; }
  .lang-grid li:nth-child(6n+3) { --c: #C9C3EA; }
  .lang-grid li:nth-child(6n+4) { --c: #A9CCEB; }
  .lang-grid li:nth-child(6n+5) { --c: #F0C2D3; }
  .lang-grid li:nth-child(6n+6) { --c: #C7DE9F; }

  .lang-card {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 0.5rem;
    width: 100%;
    height: 100%;
    padding: 0.9rem 1.1rem 1rem;
    border: 0;
    border-radius: 0.75rem;
    background: var(--c);
    color: var(--ink);
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .lang-card:hover { filter: brightness(0.97); }
  .lang-card:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }

  .lang-card h3 {
    margin: 0;
    font-size: clamp(0.95rem, 1.3vw, 1.15rem);
    font-weight: 800;
    letter-spacing: -0.01em;
    opacity: 0.65;
  }

  .lang-card .phrase {
    font-size: clamp(1.1rem, 1.7vw, 1.4rem);
    font-weight: 700;
    line-height: 1.3;
  }

  .lang-card .phrase.fresh { animation: settle 0.22s ease-out; }

  footer {
    flex: 0 0 auto;
    margin-top: 0.5rem;
    color: var(--ink-soft);
    font-size: 0.78rem;
  }

  .sr {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  @media (max-width: 820px) {
    .lang-grid { grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 480px) {
    .lang-grid { grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: reduce) {
    .opinion.fresh,
    .lang-card .phrase.fresh { animation: none; }
  }
</style>
</head>
<body>
<main class="page">
 <a class="back" href="https://coastoflight.github.io/table-talk/">&larr; Table Talk</a>

  <header>
    <h1>Opinions, likes &amp; dislikes</h1>
    <p>Tap for a new opinion. Use the language in the boxes to discuss it, giving reasons where you can. Tap a box for more language.</p>
  </header>

  <button type="button" class="opinion-tile" id="opinion-tile" aria-label="Click for another opinion">
    <span class="tag" aria-hidden="true">Opinion</span>
    <span class="opinion" id="opinion"></span>
  </button>
  <p class="sr" role="status" id="status"></p>

  <div class="lang-scroll">
    <ul class="lang-grid" id="lang-grid"></ul>
  </div>

  <footer>
    <p>COAST of LIGHT &mdash; classroom speaking practice.</p>
  </footer>
</main>

<script>
/* ---------------------------------------------------------------
   Opinions to react to. Add or remove a line freely — one
   statement per entry, no trailing comma needed on the last one.
---------------------------------------------------------------- */
const OPINIONS = [
  "Summer is the worst season.",
  "Cats make better pets than dogs.",
  "Pineapple belongs on pizza.",
  "Breakfast is the most important meal of the day.",
  "Tortilla is better without onion.",
  "Films are always worse than the book.",
  "Reality TV is a waste of time.",
  "It's rude to be on your phone during a meal.",
  "Everyone should learn to cook before leaving home.",
  "Working from home is better than going to an office.",
  "Homework should be banned.",
  "Beach holidays are boring.",
  "Football players are paid far too much.",
  "Social media does more harm than good.",
  "You should never lend money to friends.",
  "Old music is better than modern music.",
  "Mornings are the best part of the day.",
  "Tourists ruin the places they visit.",
  "Kids shouldn't have smartphones until they're 16.",
  "It's better to rent than to buy a house.",
  "Coffee tastes better than tea.",
  "You should never discuss politics at the dinner table.",
  "Video games are a waste of time.",
  "It's better to have a few close friends than many acquaintances.",
  "Traditional books are better than e-books.",
  "You should always tell the truth, even if it hurts.",
  "Money can't buy happiness.",
  "It's important to travel before settling down.",
  "School uniforms should be compulsory.",
  "Winter is better than summer.",
  "Karaoke is always a bad idea.",
  "Public transport is better than driving.",
  "It's rude to check your phone during a conversation.",
  "Everyone should try living abroad at least once.",
  "Fast food should be banned in schools.",
  "You can tell a lot about someone from their shoes.",
  "Silence is more powerful than words.",
  "Marriage isn't necessary for a happy relationship.",
  "The customer is not always right.",
  "Camping is more fun than staying in a hotel.",
  "It's better to be a big fish in a small pond.",
  "You shouldn't work more than eight hours a day.",
  "Cash is better than card.",
  "Everyone should learn a musical instrument.",
  "Zoos should be banned.",
  "The internet has made people less social.",
  "Nobody should have more than one job.",
  "Dogs are smarter than cats.",
  "New Year's resolutions never work.",
  "You should always arrive early rather than on time."
];

const tile = document.getElementById("opinion-tile");
const opinionEl = document.getElementById("opinion");
const statusEl = document.getElementById("status");

function shuffle(list) {
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
  return list;
}

/* Draws from a shuffled deck so opinions don't repeat until the whole list has been used. */
let deck = [];
let current = "";

function next() {
  if (!deck.length) {
    deck = shuffle(OPINIONS.slice());
    /* Don't start a new round with the opinion that ended the last one. */
    if (deck.length > 1 && deck[deck.length - 1] === current) deck.unshift(deck.pop());
  }
  const opinion = deck.pop();
  current = opinion;

  opinionEl.textContent = opinion;
  opinionEl.classList.remove("fresh");
  void opinionEl.offsetWidth;
  opinionEl.classList.add("fresh");
  statusEl.textContent = opinion;
}

tile.addEventListener("click", next);

/* Space or Enter = new opinion — unless the focus is on a link or a language card,
   so those keep working normally with the keyboard. */
document.addEventListener("keydown", (event) => {
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  const target = event.target;
  if (target.closest && target.closest("a, input, textarea, .lang-card")) return;
  if (target === tile) return; /* the tile is a button: the browser already clicks it */
  if (event.code === "Space" || event.code === "Enter") { event.preventDefault(); next(); }
});

next();

/* ---------------------------------------------------------------
   Language reference: each card shows one phrase at a time.
   Click a card to move to its next phrase, looping back to the
   start. Add or reorder phrases here freely.
---------------------------------------------------------------- */
const LANG_GROUPS = [
  {
    title: "Asking for opinion",
    phrases: [
      "Do you agree\u2026?",
      "What's your opinion on\u2026?",
      "What do you think about\u2026?",
      "How do you feel about\u2026?"
    ]
  },
  {
    title: "Opinion",
    phrases: [
      "In my opinion\u2026",
      "I think\u2026",
      "From my point of view\u2026",
      "The way I see it\u2026"
    ]
  },
  {
    title: "Likes / dislikes",
    phrases: [
      "I like / don't like\u2026",
      "I'm (not) into\u2026",
      "I'm (not) a keen (surfer)",
      "I'm (not) keen on / fond of (surfing)",
      "I'm (not) a fan of\u2026"
    ]
  },
  {
    title: "Agreeing",
    phrases: [
      "I agree\u2026",
      "You're absolutely right\u2026",
      "I feel the same\u2026",
      "I couldn't agree more\u2026",
      "I think so too.",
      "Totally!"
    ]
  },
  {
    title: "Disagreeing",
    phrases: [
      "I disagree\u2026",
      "I don't think so\u2026",
      "I take your point but\u2026",
      "Hmm, I'm not so sure\u2026",
      "I see what you mean but\u2026"
    ]
  },
  {
    title: "Personalising",
    phrases: [
      "Speaking from personal experience\u2026",
      "For me personally\u2026",
      "I (would) prefer \u2026 because \u2026"
    ]
  }
];

const langGrid = document.getElementById("lang-grid");

LANG_GROUPS.forEach((group) => {
  let idx = 0;

  const li = document.createElement("li");
  const card = document.createElement("button");
  card.type = "button";
  card.className = "lang-card";
  card.setAttribute("aria-label", group.title + ", click for the next phrase");

  const h3 = document.createElement("h3");
  h3.textContent = group.title;

  const phraseEl = document.createElement("span");
  phraseEl.className = "phrase";
  phraseEl.setAttribute("aria-live", "polite");
  phraseEl.textContent = group.phrases[0];

  card.appendChild(h3);
  card.appendChild(phraseEl);
  li.appendChild(card);
  langGrid.appendChild(li);

  card.addEventListener("click", () => {
    idx = (idx + 1) % group.phrases.length;
    phraseEl.textContent = group.phrases[idx];
    phraseEl.classList.remove("fresh");
    void phraseEl.offsetWidth;
    phraseEl.classList.add("fresh");
  });
});
</script>
</body>
</html>
