<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Question Prompts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    height: 100dvh;
    background: #F0C2D3;
    overflow: hidden;
  }

  .back {
    position: fixed;
    top: max(20px, env(safe-area-inset-top, 0px));
    left: 20px;
    z-index: 2;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: #10303A;
    opacity: 0.7;
    text-decoration: none;
  }
  .back:hover { opacity: 1; text-decoration: underline; }

  button.stage {
    appearance: none;
    -webkit-appearance: none;
    border: none;
    outline: none;
    background: #F0C2D3;
    width: 100%;
    height: 100%;
    height: 100dvh;
    margin: 0;
    padding: 8vw 7vw;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
  }

  button.stage:focus {
    outline: none;
  }

  .sentence {
    font-family: 'Fraunces', Georgia, serif;
    font-optical-sizing: auto;
    font-weight: 500;
    font-style: normal;
    font-size: clamp(28px, 6vw, 68px);
    line-height: 1.25;
    color: #10303A;
    letter-spacing: -0.01em;
    max-width: 900px;
    transition: opacity 500ms ease, filter 500ms ease;
    opacity: 1;
    filter: blur(0px);
  }

  .sentence.fading {
    opacity: 0;
    filter: blur(6px);
  }

  .hint {
    position: fixed;
    bottom: 28px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #10303A;
    opacity: 0.45;
    transition: opacity 1.2s ease;
    pointer-events: none;
  }

  .hint.hidden { opacity: 0; }

  .count {
    position: fixed;
    top: 28px;
    right: 32px;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: #10303A;
    opacity: 0.35;
    pointer-events: none;
  }
</style>
</head>
<body>

<a class="back" href="https://coastoflight.github.io/table-talk/">&larr; Table Talk</a>

<button class="stage" id="stage" aria-label="Show another question">
  <div class="sentence" id="sentence"></div>
</button>

<div class="hint hidden" id="hint">tap for another</div>
<div class="count" id="count"></div>

<script>
  const strategies = [
    "Can you spell your name?",
    "Who do you live with?",
    "What did you have for lunch today?",
    "What do you do in your free time?",
    "How often do you go to the cinema?",
    "How do you usually keep in touch with friends?",
    "What did you do last night?",
    "What are you good at?",
    "When’s your birthday?",
    "Is English important?",
    "Apples or oranges?",
    "What’s one food you would never eat?",
    "What’s your favourite ice cream flavour?",
    "What is the best sandwich?",
    "What’s a good / bad restaurant around here?",
    "What’s your favourite / least favourite smell?",
    "What is the most used app on your phone?",
    "Window or aisle seat?",
    "Have you ever asked a celebrity for a selfie?",
    "What advice would you give somebody about learning English?",
    "What's something you should throw out?",
    "What’s the best song at the moment?",
    "What’s the scariest animal ever?",
    "What are you going to do after class?",
    "Tell me a lie about your weekend?",
    "What’s your idea of a perfect playground?",
    "What happens when you get home from school?",
    "If you could be anywhere else right now, where would it be?",
    "How is life similar to school?",
    "What’s your favourite time of day?",
    "What is the worst thing about Sundays?",
    "Describe the rest of your day in 5 words.",
    "What's your favourite subject?",
    "When do you have English at school?",
    "What’s bad about English?",
    "What would you like to do in the future?",
    "Why do we have friends?",
    "Is reading important? Why not?",
    "What’s your favourite letter of the alphabet?",
    "What number am I thinking of?",
    "What was the last thing that made you smile?",
    "Who is the funniest person you know?",
    "If I gave you 20 euros, what would you buy?",
    "Which animal at the zoo do you like best?",
    "What is one of your favourite places?",
    "Have you ever travelled out of Spain?",
    "What are the similarities / differences between summer and winter?",
    "What are the advantages of having a pet?",
    "Do you help with jobs around the house?",
    "What risks are there in English class?",
    "Who is your favourite sports star?",
    "Would you rather win an Olympic medal or an Oscar?",
    "If you could shop for free at one store, which one would you choose?",
    "What is something people should always do?",
    "What is something you absolutely hate?",
    "Which famous person would you like to meet?",
    "What are you finding difficult at the moment?",
    "What is the objective of school?",
    "How could you improve today?",
    "If we didn’t have trees what would happen?",
    "What do you think is the most important quality in a teacher?",
    "What are rules?",
    "How might school be different in the future?",
    "What is your first memory of this academy?",
    "What can you cook?",
    "What makes for the perfect meal?",
    "What do you remember from last summer?",
    "When was the last time you swam?",
    "Can you describe the sea?",
    "How many pizzas would fit into this room?",
    "How many pencils could you fit across this table?",
    "Can you estimate how many windows there are in your town?",
    "Can you compare yesterday and today?",
    "Have you played any games today?",
    "What’s for dinner tonight?",
    "What’s stopping you?",
    "Can you escape?",
    "Where does it hurt?",
    "What are you looking for?",
    "What word would you put on a T-shirt that sums you up?",
    "If today had a title, what would it be?",
    "Who would play you in a shampoo commercial?",
    "What’s the best thing to put ketchup on?",
    "What would you ban if you were in charge for a day?",
    "What is your motto?",
    "When do you lie?",
    "What would your entrance song be?",
    "What do you refuse to be quiet about?",
    "What’s one of your favourite restaurants?",
    "What was the last thing you ate?",
    "What food would you frame as art?",
    "What flavour do you carry from childhood?",
    "What would be your last meal?"
  ];

  const sentenceEl = document.getElementById('sentence');
  const hintEl = document.getElementById('hint');
  const countEl = document.getElementById('count');
  const stageEl = document.getElementById('stage');

  /* Questions come from a shuffled deck, so none repeats until all have been shown. */
  let deck = [];
  let shown = 0;
  let last = null;

  function shuffle(list) {
    for (let i = list.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [list[i], list[j]] = [list[j], list[i]];
    }
    return list;
  }

  function draw() {
    if (!deck.length) {
      deck = shuffle(strategies.slice());
      shown = 0;
      if (deck.length > 1 && deck[deck.length - 1] === last) deck.unshift(deck.pop());
    }
    last = deck.pop();
    shown++;
    return last;
  }

  function next() {
    const question = draw();

    sentenceEl.classList.add('fading');

    setTimeout(() => {
      sentenceEl.textContent = question;
      countEl.textContent = shown + " / " + strategies.length;
      sentenceEl.classList.remove('fading');
    }, 350);

    /* Show "tap for another" under the first question only, then fade it away. */
    if (shown === 1 && !hintEl.dataset.used) {
      hintEl.dataset.used = "yes";
      hintEl.classList.remove('hidden');
    } else {
      hintEl.classList.add('hidden');
    }
  }

  (function init() {
    sentenceEl.textContent = "Tap for a question";
  })();

  stageEl.addEventListener('click', next);
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      next();
    }
  });
</script>

</body>
</html>
