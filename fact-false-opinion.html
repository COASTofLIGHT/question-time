<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fact, False or Opinion?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
  :root {
    --mist: #EDF3F2;
    --ink: #10303A;
    --ink-soft: #456670;
    --focus: #0B62A4;
    --board: #C7DE9F;
    --lang: #F0C2D3;
    --fact: #A9CCEB;
    --false: #F4B5A0;
    --opinion: #F2D9A6;
    --font: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--mist); color: var(--ink); font-family: var(--font); -webkit-text-size-adjust: 100%; }

  .page {
    height: 100%; max-width: 1400px; margin: 0 auto;
    padding: clamp(0.75rem, 2vw, 1.5rem) clamp(1rem, 3vw, 2.25rem);
    display: flex; flex-direction: column; gap: clamp(0.5rem, 1.5vh, 1rem);
  }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; }
  .top h1 { margin: 0; font-size: clamp(1.5rem, 2.8vw, 2.2rem); font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }
  .back { color: var(--ink-soft); font-size: 0.95rem; text-decoration: none; white-space: nowrap; }
  .back:hover { text-decoration: underline; }
  .back:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.6fr 1fr; gap: clamp(0.6rem, 1.6vw, 1.1rem); }
  section { border-radius: 0.9rem; padding: clamp(1rem, 2.5vw, 2rem); min-height: 0; overflow-y: auto; }

  /* Left: the game */
  .board { background: var(--board); display: flex; flex-direction: column; }
  .round { margin: 0; font-size: clamp(1rem, 1.5vw, 1.2rem); font-weight: 700; color: var(--ink-soft); }
  .sayit { flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 0; }
  .sentence {
    margin: 0; font-size: clamp(1.6rem, min(4.2vw, 7vh), 3.6rem); font-weight: 700;
    letter-spacing: -0.02em; line-height: 1.15; text-wrap: balance;
  }
  .extra {
    margin: 0.8em 0 0; font-size: clamp(1.05rem, min(1.9vw, 3.2vh), 1.6rem); line-height: 1.3;
    min-height: 2.6em; opacity: 0; transition: opacity 0.35s ease;
  }
  .extra.on { opacity: 1; }

  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(0.6rem, 1.6vw, 1.1rem); }
  .tile {
    background: var(--c); border-radius: 0.9rem; text-align: center;
    padding: clamp(0.6rem, 2.2vh, 1.4rem) 0.5rem;
    font-size: clamp(1.3rem, min(2.8vw, 4.6vh), 2.3rem); font-weight: 800;
    transition: opacity 0.35s ease, transform 0.35s ease, box-shadow 0.35s ease;
  }
  .revealed .tile { opacity: 0.3; transform: scale(0.96); }
  .revealed .tile.on { opacity: 1; transform: scale(1); box-shadow: inset 0 0 0 3px var(--ink); }
  .fact { --c: var(--fact); }
  .false { --c: var(--false); }
  .opinion { --c: var(--opinion); }
  .your-turn .tiles { visibility: hidden; }

  .controls { margin-top: clamp(0.75rem, 2vh, 1.25rem); display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }
  button.btn {
    font: inherit; font-weight: 600; font-size: 1rem; padding: 0.55em 1.1em; border-radius: 0.6rem;
    border: 2px solid var(--ink); background: var(--ink); color: var(--mist); cursor: pointer;
  }
  button.btn.ghost { background: transparent; color: var(--ink); }
  button.btn:hover { filter: brightness(1.15); }
  button.btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .count { font-weight: 600; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

  /* Right: useful language */
  .lang { background: var(--lang); }
  .lang h3 { margin: 0 0 0.35em; font-size: clamp(1rem, 1.4vw, 1.2rem); font-weight: 800; padding-bottom: 0.25em; border-bottom: 2px solid rgba(16, 48, 58, 0.25); }
  .lang ul { list-style: none; margin: 0 0 clamp(0.8rem, 2.2vh, 1.4rem); padding: 0; }
  .lang li { font-size: clamp(1.05rem, min(1.8vw, 3.2vh), 1.5rem); line-height: 1.3; margin-bottom: 0.3em; }
  .lang b { font-weight: 800; }
  .lang .gap { color: var(--ink-soft); }

  @media (max-width: 800px) {
    html, body, .page { height: auto; }
    main { grid-template-columns: 1fr; }
    .sayit { min-height: 35vh; }
  }
  @media (prefers-reduced-motion: reduce) { .tile, .extra { transition: none; } }
</style>
</head>
<body>
<div class="page">

  <div class="top">
    <h1>Fact, False or Opinion?</h1>
    <a class="back" href="https://coastoflight.github.io/table-talk/">&larr; Table Talk</a>
  </div>

  <main>
    <section class="board" id="board">
      <p class="round" id="round"></p>

      <div class="sayit">
        <p class="sentence" id="sentence"></p>
        <p class="extra" id="extra"></p>
      </div>

      <div class="tiles" aria-hidden="true">
        <div class="tile fact" data-a="fact">Fact</div>
        <div class="tile false" data-a="false">False</div>
        <div class="tile opinion" data-a="opinion">Opinion</div>
      </div>

      <div class="controls">
        <button class="btn ghost" id="prev">Back</button>
        <button class="btn" id="next">Reveal</button>
        <span class="count" id="count"></span>
      </div>
    </section>

    <section class="lang" aria-label="Useful language">
      <h3>Deciding</h3>
      <ul>
        <li>That's <b>a fact</b>.</li>
        <li>That's <b>not true</b>. <b>Actually,</b> it's <span class="gap">…</span></li>
        <li>That's <b>just an opinion</b>.</li>
        <li><b>It depends</b> on <span class="gap">…</span></li>
      </ul>
      <h3>Asking each other</h3>
      <ul>
        <li>What do you think?</li>
        <li>Do you agree?</li>
        <li>I'm <b>not sure, but I think</b> <span class="gap">…</span></li>
      </ul>
    </section>
  </main>

</div>

<script>
  // ============================================================
  // TOPIC PACKS
  // To add a topic, copy one pack (from { name: ... to the closing ] },)
  // and paste it at the end of the list. Then change the name and the
  // 10 sentences. a = "fact", "false" or "opinion".
  // note = what appears after the reveal.
  // The page mixes all the packs together by itself.
  // ============================================================
  const topics = [
    { name: "Australia", items: [
      { s: "The official language is French.", a: "false",
        note: "Most people speak English. (By law, Australia doesn't have an official language.)" },
      { s: "It is the best country in the world!", a: "opinion",
        note: "Some people think so. Others don't." },
      { s: "The doctors have wings and can fly.", a: "false",
        note: "No wings, but the Flying Doctors really do fly planes to help people in the outback." },
      { s: "The people are so friendly.", a: "opinion",
        note: "Maybe! But not everyone agrees." },
      { s: "There are more kangaroos than people in Australia.", a: "fact",
        note: "There are millions more kangaroos than people." },
      { s: "Christmas is in the summer in Australia.", a: "fact",
        note: "December is summer there, so lots of people go to the beach on Christmas Day." },
      { s: "My mum thinks that Australia is dangerous.", a: "fact",
        note: "It's a fact that she thinks it. Is Australia dangerous? That's an opinion." },
      { s: "They use € for money.", a: "false",
        note: "They use the Australian dollar." },
      { s: "The capital is Sydney.", a: "false",
        note: "The capital is Canberra." },
      { s: "There are lots of tigers in Australia.", a: "false",
        note: "There are no wild tigers, but there are lots of kangaroos and koalas." }
    ] },

    { name: "Cats", items: [
      { s: "Cats sleep for 12 to 16 hours a day.", a: "fact",
        note: "That's more than half the day!" },
      { s: "Cats are better than dogs.", a: "opinion",
        note: "Cat people say yes. Dog people say no." },
      { s: "All cats hate water.", a: "false",
        note: "Most cats don't like getting wet, but some cats love to swim." },
      { s: "A group of cats is called a clowder.", a: "fact",
        note: "It's a strange word, but it's true!" },
      { s: "Cats have nine lives.", a: "false",
        note: "It's an old saying. In Spain, people say cats have seven lives!" },
      { s: "Cats always land on their feet.", a: "false",
        note: "They're very good at it, but not always, and a fall can still hurt them." },
      { s: "Black cats are unlucky.", a: "opinion",
        note: "Some people believe it. In the UK, some people think black cats are lucky!" },
      { s: "Cats can't taste sweet things.", a: "fact",
        note: "Cats can't taste sugar, so they aren't interested in cake." },
      { s: "Cats are very easy to look after.", a: "opinion",
        note: "Some owners say yes. Others say cats are hard work!" },
      { s: "Cats only purr when they're happy.", a: "false",
        note: "Cats also purr when they're scared or hurt." }
    ] }
  ];

  // ============================================================
  // Mixing: always the same order (fixed seed), never more than
  // two sentences from the same topic in a row.
  // ============================================================
  function seeded(seed) {
    return () => {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const rand = seeded(2026);
  const all = [];
  topics.forEach(t => t.items.forEach(it => all.push({ round: t.name, ...it })));
  for (let i = all.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [all[i], all[j]] = [all[j], all[i]];
  }
  for (let i = 2; i < all.length; i++) {
    if (all[i].round === all[i - 1].round && all[i].round === all[i - 2].round) {
      const k = all.findIndex((x, n) => n > i && x.round !== all[i].round);
      if (k > -1) [all[i], all[k]] = [all[k], all[i]];
    }
  }

  const steps = all.map((it, i) => ({ ...it, n: i + 1, total: all.length }));
  steps.push({ round: "Your turn", yourTurn: true });

  let pos = 0, revealed = false;
  const $ = id => document.getElementById(id);
  const board = $("board"), nextBtn = $("next");
  const tiles = document.querySelectorAll(".tile");

  function show() {
    const st = steps[pos];
    $("round").textContent = st.round;
    board.classList.toggle("your-turn", !!st.yourTurn);
    board.classList.toggle("revealed", revealed);

    if (st.yourTurn) {
      $("sentence").textContent = "Your turn. Make one fact, one false sentence and one opinion about where you live.";
      $("extra").textContent = "The class guesses which is which.";
      $("extra").classList.add("on");
      $("count").textContent = "";
      nextBtn.textContent = "Next";
      return;
    }

    $("sentence").textContent = st.s;
    $("extra").textContent = st.note;
    $("extra").classList.toggle("on", revealed);
    tiles.forEach(t => t.classList.toggle("on", revealed && t.dataset.a === st.a));
    $("count").textContent = `${st.n} / ${st.total}`;
    nextBtn.textContent = revealed ? "Next" : "Reveal";
  }

  function move(d) {
    pos = (pos + d + steps.length) % steps.length;
    revealed = false;
    show();
  }
  function forward() {
    if (!revealed && !steps[pos].yourTurn) { revealed = true; show(); } else { move(1); }
  }

  nextBtn.addEventListener("click", forward);
  $("prev").addEventListener("click", () => move(-1));
  document.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") forward();
    if (e.key === "ArrowLeft") move(-1);
  });

  show();
</script>
</body>
</html>
