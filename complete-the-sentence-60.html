<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Complete the Sentence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    height: 100dvh;
    background: #F2D9A6;
    overflow: hidden;
  }

  .back {
    position: fixed;
    top: max(20px, env(safe-area-inset-top, 0px));
    left: 20px;
    z-index: 2;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: #10303A;
    opacity: 0.7;
    text-decoration: none;
  }
  .back:hover { opacity: 1; text-decoration: underline; }

  button.stage {
    appearance: none;
    -webkit-appearance: none;
    border: none;
    outline: none;
    background: #F2D9A6;
    width: 100%;
    height: 100%;
    height: 100dvh;
    margin: 0;
    padding: 8vw 7vw;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
  }

  button.stage:focus {
    outline: none;
  }

  .sentence {
    font-family: 'Fraunces', Georgia, serif;
    font-optical-sizing: auto;
    font-weight: 500;
    font-style: normal;
    font-size: clamp(28px, 6vw, 68px);
    line-height: 1.25;
    color: #10303A;
    letter-spacing: -0.01em;
    max-width: 900px;
    transition: opacity 500ms ease, filter 500ms ease;
    opacity: 1;
    filter: blur(0px);
  }

  .sentence.fading {
    opacity: 0;
    filter: blur(6px);
  }

  .hint {
    position: fixed;
    bottom: 28px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #10303A;
    opacity: 0.45;
    transition: opacity 1.2s ease;
    pointer-events: none;
  }

  .hint.hidden { opacity: 0; }

  .count {
    position: fixed;
    top: 28px;
    right: 32px;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: #10303A;
    opacity: 0.35;
    pointer-events: none;
  }
</style>
</head>
<body>

<a class="back" href="https://coastoflight.github.io/question-time/">&larr; Question Time</a>

<button class="stage" id="stage" aria-label="Show another sentence starter">
  <div class="sentence" id="sentence"></div>
</button>

<div class="hint hidden" id="hint">tap for another</div>
<div class="count" id="count"></div>

<script>
  const strategies = [
    "Happiness is…",
    "On Mondays…",
    "In my free time…",
    "My favourite…",
    "Yesterday…",
    "In the future…",
    "I never…",
    "I always…",
    "One place I would love to visit is…",
    "My favourite meal to cook is…",
    "A hobby I enjoy is…",
    "My dream job is…",
    "My favourite type of weather is…",
    "If I could study any subject at university, it would be…",
    "The best part of my day is…",
    "An interesting fact about my hometown is…",
    "My favourite social media platform is…",
    "The most useful technology for me is…",
    "If I could start a YouTube channel, it would be about…",
    "A new skill I want to learn this year is…",
    "A language I would love to learn is…",
    "An outdoor activity I enjoy is…",
    "The best gift I've ever received was…",
    "My best friend is…",
    "On weekends, I usually…",
    "My favourite film is…",
    "The last book I read was…",
    "My favourite season is…",
    "I'm afraid of…",
    "My family is…",
    "I feel happy when…",
    "My favourite sport is…",
    "The last time I laughed a lot was…",
    "If I had more time, I would…",
    "My favourite animal is…",
    "I usually eat breakfast at…",
    "My favourite colour is…",
    "At school, I'm good at…",
    "My favourite song right now is…",
    "I get nervous when…",
    "My perfect weekend would be…",
    "The last holiday I went on was…",
    "I would love to meet…",
    "My favourite time of day is…",
    "I feel proud when…",
    "If I won the lottery, I would…",
    "My favourite app is…",
    "The best advice I've ever received is…",
    "I relax by…",
    "Last year…",
    "I was born…",
    "I have never…"
  ];

  const sentenceEl = document.getElementById('sentence');
  const hintEl = document.getElementById('hint');
  const countEl = document.getElementById('count');
  const stageEl = document.getElementById('stage');

  /* Questions come from a shuffled deck, so none repeats until all have been shown. */
  let deck = [];
  let shown = 0;
  let last = null;

  function shuffle(list) {
    for (let i = list.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [list[i], list[j]] = [list[j], list[i]];
    }
    return list;
  }

  function draw() {
    if (!deck.length) {
      deck = shuffle(strategies.slice());
      shown = 0;
      if (deck.length > 1 && deck[deck.length - 1] === last) deck.unshift(deck.pop());
    }
    last = deck.pop();
    shown++;
    return last;
  }

  function next() {
    const question = draw();

    sentenceEl.classList.add('fading');

    setTimeout(() => {
      sentenceEl.textContent = question;
      countEl.textContent = shown + " / " + strategies.length;
      sentenceEl.classList.remove('fading');
    }, 350);

    /* Show "tap for another" under the first question only, then fade it away. */
    if (shown === 1 && !hintEl.dataset.used) {
      hintEl.dataset.used = "yes";
      hintEl.classList.remove('hidden');
    } else {
      hintEl.classList.add('hidden');
    }
  }

  (function init() {
    sentenceEl.textContent = "Tap to begin.";
  })();

  stageEl.addEventListener('click', next);
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      next();
    }
  });
</script>

</body>
</html>
