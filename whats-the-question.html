<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What's the Question?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
  :root {
    --mist: #EDF3F2;
    --ink: #10303A;
    --ink-soft: #456670;
    --focus: #0B62A4;
    --panel: #F9FBFB;
    --line: rgba(16, 48, 58, 0.14);
    /* Level colours, as in Word Lab */
    --a1: #F2D9A6;  /* sand yellow */
    --a2: #F4B5A0;  /* coral orange */
    --b1: #A9CCEB;  /* sky blue */
    --b2: #A8D5CB;  /* sea green */
    --level: var(--a2);
    --font: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { height: 100%; }
  body {
    margin: 0; min-height: 100%;
    background: var(--mist); color: var(--ink);
    font-family: var(--font);
    -webkit-text-size-adjust: 100%;
  }
  main {
    max-width: 960px; margin: 0 auto;
    padding: clamp(1rem, 3vw, 2rem);
    display: flex; flex-direction: column; gap: 0.8rem;
  }
  button { font-family: var(--font); color: var(--ink); }
  button:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }

  .back { align-self: flex-start; color: var(--ink-soft); font-size: 0.95rem; text-decoration: none; }
  .back:hover { text-decoration: underline; }
  .back:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  h1 { margin: 0; font-size: clamp(1.9rem, 4vw, 3rem); font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }
  .hint { margin: 0.35rem 0 0; color: var(--ink-soft); font-size: 1.05rem; }

  /* Pickers */
  .row { display: flex; flex-wrap: wrap; gap: 0.6rem 1.6rem; align-items: center; }
  fieldset { border: 0; padding: 0; margin: 0; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  legend { float: left; margin-right: 8px; color: var(--ink-soft); font-size: 0.95rem; }
  .seg { position: relative; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg span {
    display: inline-block; padding: 8px 15px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-size: 1rem;
  }
  .seg input:checked + span { background: var(--ink); color: var(--mist); border-color: var(--ink); }
  .seg input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 3px; }
  /* Level chips show their colour when picked */
  .levels .seg input:checked + span { color: var(--ink); border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); font-weight: 700; }
  .levels .seg input[value="a1"]:checked + span { background: var(--a1); }
  .levels .seg input[value="a2"]:checked + span { background: var(--a2); }
  .levels .seg input[value="b1"]:checked + span { background: var(--b1); }
  .levels .seg input[value="b2"]:checked + span { background: var(--b2); }

  /* The box */
  .box {
    position: relative;
    border: 0; width: 100%; cursor: pointer; text-align: left;
    background: var(--level);
    border-radius: 1.4rem;
    min-height: clamp(240px, 44vh, 420px);
    padding: clamp(1.4rem, 4vw, 3rem);
    display: flex; flex-direction: column; justify-content: center; gap: 1rem;
    transition: background-color 250ms ease;
  }
  .box:hover { filter: brightness(0.99); }
  .count {
    position: absolute; top: 1rem; right: 1.3rem;
    font-size: 0.85rem; opacity: 0.55; font-variant-numeric: tabular-nums;
  }
  .label { margin: 0; font-size: 1rem; font-weight: 700; opacity: 0.7; }
  .content { display: flex; flex-direction: column; gap: 1.2rem; transition: opacity 300ms ease; }
  .content.fading { opacity: 0; }
  .answer {
    margin: 0;
    font-size: clamp(2.2rem, 6vw, 4.2rem); font-weight: 800;
    line-height: 1.1; letter-spacing: -0.02em; text-wrap: balance;
  }
  .answer::before { content: "\201C"; }
  .answer::after { content: "\201D"; }
  .example {
    margin: 0; font-size: clamp(1.1rem, 2.4vw, 1.5rem);
    background: var(--panel); border-radius: 0.8rem; padding: 0.6em 0.9em; align-self: flex-start;
  }
  .example span { color: var(--ink-soft); font-size: 0.8em; display: block; margin-bottom: 0.15em; }
  .example b { font-weight: 800; }
  .example[hidden] { display: none; }

  .controls { display: flex; justify-content: flex-end; gap: 0.8rem; flex-wrap: wrap; }
  .reveal { display: flex; flex-direction: column; align-items: flex-start; gap: 0.7rem; min-height: 3.6rem; }
  .show {
    border: 2px solid var(--ink); cursor: pointer; border-radius: 0.8rem; background: transparent;
    font-size: 1.05rem; font-weight: 700; padding: 8px 18px;
  }
  .show:hover { background: rgba(255, 255, 255, 0.45); }
  .show[hidden] { display: none; }
  .next {
    border: 0; cursor: pointer; border-radius: 0.9rem; background: var(--ink); color: var(--mist);
    font-size: 1.4rem; font-weight: 800; padding: 12px 34px; min-height: 56px;
  }
  .next:hover { background: #1B4652; }

  footer { color: var(--ink-soft); font-size: 0.85rem; }

  @media (prefers-reduced-motion: reduce) {
    .content, .box { transition: none; }
  }
</style>
</head>
<body>
<main>
  <a class="back" href="https://coastoflight.github.io/question-time/">&larr; Question Time</a>

  <header>
    <h1>What's the Question?</h1>
    <p class="hint">Here's the answer. Can you make the question?</p>
  </header>

  <div class="row">
    <fieldset class="levels">
      <legend>Level</legend>
      <label class="seg"><input type="radio" name="level" value="a1"><span>A1</span></label>
      <label class="seg"><input type="radio" name="level" value="a2" checked><span>A2</span></label>
      <label class="seg"><input type="radio" name="level" value="b1"><span>B1</span></label>
      <label class="seg"><input type="radio" name="level" value="b2"><span>B2</span></label>
    </fieldset>
  </div>

  <div class="box" id="box">
    <span class="count" id="count"></span>
    <div class="content" id="content">
      <span class="label">The answer is…</span>
      <p class="answer" id="answer" aria-live="polite"></p>
      <div class="reveal">
        <button class="show" type="button" id="show">Show an example question</button>
        <p class="example" id="example" hidden><span>One possible question</span><b id="question"></b></p>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="next" type="button" id="next">Next</button>
  </div>

  <footer>Tap the box, press Next or press Space for a new answer. There's usually more than one good question, so the one shown is just an example.</footer>
</main>

  const $ = id => document.getElementById(id);
  const val = name => document.querySelector(`input[name="${name}"]:checked`).value;
  function shuffle(list) {
    for (let i = list.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [list[i], list[j]] = [list[j], list[i]];
    }
    return list;
  }
  /* A shuffled deck per level, so nothing repeats until all 50 have been shown */
  const decks = {};
  function draw(lv) {
    let d = decks[lv];
    if (!d || !d.cards.length) {
      const last = d ? d.last : null;
      d = decks[lv] = { cards: shuffle(ITEMS[lv].slice()), last, shown: 0 };
      if (d.cards.length > 1 && d.cards[d.cards.length - 1] === last) d.cards.unshift(d.cards.pop());
    }
    d.last = d.cards.pop();
    d.shown++;
    return d.last;
  }

  const content = $("content");
  function next() {
    const lv = val("level");
    const item = draw(lv);
    content.classList.add("fading");
    setTimeout(() => {
      $("answer").textContent = item[0];
      $("question").textContent = item[1];
      $("example").hidden = true;
      $("show").hidden = false;
      $("count").textContent = decks[lv].shown + " / " + ITEMS[lv].length;
      content.classList.remove("fading");
    }, 220);

    $("example").hidden = false;
    $("show").hidden = true;

  document.querySelectorAll('input[name="level"]').forEach(r => r.addEventListener("change", setLevel));

    if (e.target instanceof HTMLButtonElement || e.target instanceof HTMLInputElement || e.target instanceof HTMLAnchorElement) return;
    e.preventDefault();
    next();
  });

  setLevel();
})();
</script>
