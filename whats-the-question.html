<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What's the Question?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
  :root {
    --mist: #EDF3F2;
    --ink: #10303A;
    --ink-soft: #456670;
    --line: #5F808A;
    --sea: #17677A;
    --sea-deep: #124F5E;
    --focus: #0B62A4;
    --panel: #F9FBFB;
    /* Level colours, as in Word Lab */
    --a1: #F2D9A6;  /* sand yellow */
    --a2: #F4B5A0;  /* coral orange */
    --b1: #A9CCEB;  /* sky blue */
    --b2: #A8D5CB;  /* sea green */
    --level: var(--a2);
    --font: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--mist);
    color: var(--ink);
    font-family: var(--font);
    -webkit-text-size-adjust: 100%;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  button { font-family: var(--font); color: var(--ink); }

  .page {
    max-width: 1100px;
    margin: 0 auto;
    padding: clamp(1rem, 3vw, 2.25rem);
  }

  /* ---------- Title, level tabs and the way back (as on Wordlists) ---------- */
  .top { display: flex; flex-wrap: wrap; align-items: flex-end; column-gap: clamp(1rem, 2.5vw, 2rem); }
  .top h1 { margin: 0 0 0.6rem; font-size: clamp(1.4rem, 2.8vw, 2.1rem); font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }
  .back { margin: 0 0 0.75rem auto; color: var(--ink-soft); font-size: 0.9rem; text-decoration: none; white-space: nowrap; }
  .back:hover { text-decoration: underline; }
  .back:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  /* The levels are the tabs. Each keeps a small dot in its level colour. */
  .tabs { display: flex; gap: 0.2rem; }
  .tabs label { position: relative; display: block; }
  .tabs input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
  .tabs span {
    display: flex; align-items: center; gap: 0.45rem;
    height: 2.75rem; padding: 0 1.15rem; border-radius: 0.7rem 0.7rem 0 0;
    color: var(--ink-soft); font-size: 1rem; font-weight: 700; white-space: nowrap;
  }
  .tabs span::before { content: ""; width: 0.7rem; height: 0.7rem; border-radius: 50%; background: var(--lv); }
  .tabs input:hover + span { background: rgba(255, 255, 255, 0.55); color: var(--ink); }
  .tabs input:checked + span { background: var(--panel); color: var(--ink); }
  .tabs input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: -3px; }

  /* ---------- The frame everything sits on ---------- */
  .frame { display: flex; flex-direction: column; gap: 0.9rem; background: var(--panel); border-radius: 0.9rem; padding: clamp(0.8rem, 2vw, 1.4rem); }
  .source { margin: 0; color: var(--ink-soft); font-size: 1rem; }

  /* Twist */
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem 1.75rem; }
  .group { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem 0.9rem; }
  .group-label { font-weight: 600; }
  .choices { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .choices label { position: relative; display: block; }
  .choices input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
  .choices span {
    display: grid; place-items: center;
    min-width: 2.75rem; height: 2.75rem; padding: 0 1rem;
    border: 2px solid var(--line); border-radius: 0.6rem;
    font-size: 1.1rem; font-weight: 700;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s;
  }
  .choices input:not(:checked):hover + span { border-color: var(--ink); }
  .choices input:checked + span { background: var(--ink); border-color: var(--ink); color: var(--mist); }
  .choices input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 3px; }

  /* ---------- The question box, in the level colour ---------- */
  .box {
    position: relative;
    width: 100%;
    min-height: clamp(15rem, calc(100vh - 22rem), 30rem);
    padding: clamp(1.4rem, 4vw, 3rem);
    border: 0;
    border-radius: 0.9rem;
    background: var(--level);
    text-align: left;
    cursor: pointer;
    display: flex; flex-direction: column; justify-content: center;
    transition: background-color 250ms ease;
  }
  @supports (height: 100svh) {
    .box { min-height: clamp(15rem, calc(100svh - 22rem), 30rem); }
  }
  .box:hover { filter: brightness(0.98); }
  .box:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }

  .count {
    position: absolute; top: 1rem; right: 1.3rem;
    font-size: 0.9rem; font-weight: 600; opacity: 0.55; font-variant-numeric: tabular-nums;
  }
  .content { display: flex; flex-direction: column; gap: 1.2rem; transition: opacity 300ms ease; }
  .content.fading { opacity: 0; }
  .label { margin: 0; font-size: 1rem; font-weight: 700; opacity: 0.7; }
  .answer {
    margin: 0;
    font-size: clamp(2rem, 5vw, 3.4rem); font-weight: 800;
    line-height: 1.1; letter-spacing: -0.02em; text-wrap: balance;
  }
  .answer::before { content: "\201C"; }
  .answer::after { content: "\201D"; }
  .reveal { display: flex; flex-direction: column; align-items: flex-start; min-height: 3.6rem; }
  .example {
    margin: 0; font-size: clamp(1.1rem, 2.4vw, 1.5rem);
    background: var(--panel); border-radius: 0.6rem; padding: 0.6em 0.9em; cursor: default;
  }
  .example span { color: var(--ink-soft); font-size: 0.8em; display: block; margin-bottom: 0.15em; }
  .example b { font-weight: 800; }

  /* ---------- Next ---------- */
  .buttons { display: flex; flex-wrap: wrap; gap: 0.6rem; }
  .show {
    height: 3.25rem; padding: 0 1.4rem;
    border: 0; border-radius: 0.6rem;
    background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--line);
    font-size: 1.1rem; font-weight: 700; cursor: pointer;
  }
  .show:hover { box-shadow: inset 0 0 0 2px var(--ink); }
  .show:active { transform: translateY(1px); }
  .show:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .next {
    flex: 1 1 12rem; height: 3.25rem; padding: 0 1.6rem;
    border: 0; border-radius: 0.6rem;
    background: var(--sea); color: #fff;
    font-size: 1.2rem; font-weight: 700; cursor: pointer;
  }
  .next:hover { background: var(--sea-deep); }
  .next:active { transform: translateY(1px); }
  .next:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

  .hint { margin: 0.2rem 0 0; color: var(--ink-soft); font-size: 0.95rem; }

  @media (max-width: 640px) {
    .tabs { order: 3; flex-basis: 100%; }
    .tabs span { padding: 0 0.9rem; }
    .show { flex: 1 1 100%; }
    .box { min-height: 16rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .content, .box, .choices span { transition: none; }
  }
</style>
</head>
<body>
<main class="page">
  <div class="top">
    <h1>What's the Question?</h1>
    <div class="tabs" role="radiogroup" aria-label="Level">
      <label style="--lv: var(--a1)"><input type="radio" name="level" value="a1"><span>A1</span></label>
      <label style="--lv: var(--a2)"><input type="radio" name="level" value="a2" checked><span>A2</span></label>
      <label style="--lv: var(--b1)"><input type="radio" name="level" value="b1"><span>B1</span></label>
      <label style="--lv: var(--b2)"><input type="radio" name="level" value="b2"><span>B2</span></label>
    </div>
    <a class="back" href="./">&larr; Question Time</a>
  </div>

  <div class="frame">
    <p class="source">Here's the answer. Can you make the question?</p>

    <div class="box" id="box">
      <span class="count" id="count"></span>
      <div class="content" id="content">
        <span class="label">The answer is&hellip;</span>
        <p class="answer" id="answer" aria-live="polite"></p>
        <div class="reveal">
          <p class="example" id="example" hidden><span>One possible question</span><b id="question"></b></p>
        </div>
      </div>
    </div>

    <div class="buttons">
      <button class="show" type="button" id="show">Show an example question</button>
      <button class="next" type="button" id="next">Next answer</button>
    </div>

    <p class="hint">Tap the box, press Next answer or press Space for a new answer. There's usually more than one good question, so the one shown is just an example.</p>
  </div>
</main>

  const $ = id => document.getElementById(id);
  const val = name => document.querySelector(`input[name="${name}"]:checked`).value;
  function shuffle(list) {
    for (let i = list.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [list[i], list[j]] = [list[j], list[i]];
    }
    return list;
  }
  /* A shuffled deck per level, so nothing repeats until all 50 have been shown */
  const decks = {};
  function draw(lv) {
    let d = decks[lv];
    if (!d || !d.cards.length) {
      const last = d ? d.last : null;
      d = decks[lv] = { cards: shuffle(ITEMS[lv].slice()), last, shown: 0 };
      if (d.cards.length > 1 && d.cards[d.cards.length - 1] === last) d.cards.unshift(d.cards.pop());
    }
    d.last = d.cards.pop();
    d.shown++;
    return d.last;
  }

  const content = $("content");
  function next() {
    const lv = val("level");
    const item = draw(lv);
    content.classList.add("fading");
    setTimeout(() => {
      $("answer").textContent = item[0];
      $("question").textContent = item[1];
      $("example").hidden = true;
      $("show").textContent = "Show an example question";
      $("count").textContent = decks[lv].shown + " / " + ITEMS[lv].length;
      content.classList.remove("fading");
    }, 220);
  }
  function toggleExample() {
    const ex = $("example");
    ex.hidden = !ex.hidden;
    $("show").textContent = ex.hidden ? "Show an example question" : "Hide the example";
  }

    document.documentElement.style.setProperty("--level", `var(--${val("level")})`);
    next();
  }

  $("show").addEventListener("click", toggleExample);
  $("example").addEventListener("click", e => e.stopPropagation());
  document.querySelectorAll('input[name="level"]').forEach(r => r.addEventListener("change", setLevel));
  document.addEventListener("keydown", e => {

    if (e.target instanceof HTMLButtonElement || e.target instanceof HTMLInputElement || e.target instanceof HTMLAnchorElement) return;
    e.preventDefault();
    next();
  });

  setLevel();
})();
</script>
